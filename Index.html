<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCull AI - Aftershoots Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f1115; color: #e2e8f0; }
        
        /* Card Styles */
        .photo-card { position: relative; border-radius: 12px; overflow: hidden; background: #1e293b; transition: all 0.3s ease; cursor: pointer; border: 2px solid transparent; }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        /* Categories Colors */
        .cat-good { border-color: #10b981; box-shadow: 0 0 15px rgba(16,185,129,0.2); }
        .cat-moderate { border-color: #f59e0b; box-shadow: 0 0 15px rgba(245,158,11,0.2); }
        .cat-bad { border-color: #ef4444; opacity: 0.6; filter: grayscale(80%); }
        .cat-bad:hover { opacity: 1; filter: grayscale(0%); }

        /* Badges & Labels */
        .status-badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); z-index: 10; font-size: 14px; }
        .reason-tag { position: absolute; bottom: 8px; left: 8px; right: 8px; background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 6px; font-size: 10px; text-align: center; backdrop-filter: blur(4px); z-index: 10; line-height: 1.3; }
        
        /* Selection Checkbox Overlay */
        .check-overlay { position: absolute; top: 8px; left: 8px; width: 24px; height: 24px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; z-index: 11; transition: all 0.2s; background: rgba(0,0,0,0.3); }
        .photo-card.manual-select .check-overlay { background: #10b981; border-color: #10b981; color: white; }
        
        /* Scanner Animation */
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #3b82f6; box-shadow: 0 0 10px #3b82f6; animation: scan 1.5s infinite linear; z-index: 20; display: none; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .scanning .scanner-line { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-[#0f1115]/90 backdrop-blur border-b border-white/5 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="ph ph-aperture text-2xl text-blue-500"></i>
            <span class="font-bold text-lg tracking-tight">ProCull <span class="text-blue-500">AI</span></span>
        </div>
        <button id="btnExport" class="hidden bg-blue-600 hover:bg-blue-500 text-white px-4 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-2 transition shadow-lg shadow-blue-500/20">
            <i class="ph ph-download-simple"></i> Export ZIP
        </button>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-6xl">
        
        <!-- Stats Bar -->
        <div id="statsBar" class="hidden grid grid-cols-3 gap-3 mb-6">
            <div class="bg-emerald-500/10 border border-emerald-500/20 p-3 rounded-xl text-center">
                <div class="text-2xl font-bold text-emerald-400" id="countGood">0</div>
                <div class="text-xs text-emerald-500/70 uppercase font-bold">Baik (Keep)</div>
            </div>
            <div class="bg-amber-500/10 border border-amber-500/20 p-3 rounded-xl text-center">
                <div class="text-2xl font-bold text-amber-400" id="countMod">0</div>
                <div class="text-xs text-amber-500/70 uppercase font-bold">Moderat</div>
            </div>
            <div class="bg-red-500/10 border border-red-500/20 p-3 rounded-xl text-center">
                <div class="text-2xl font-bold text-red-400" id="countBad">0</div>
                <div class="text-xs text-red-500/70 uppercase font-bold">Jelek (Reject)</div>
            </div>
        </div>

        <!-- Upload Area -->
        <div id="uploadArea" class="border-2 border-dashed border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-blue-500 hover:bg-blue-500/5 transition mb-8 group">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <div class="pointer-events-none">
                <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition">
                    <i class="ph ph-upload-simple text-3xl text-blue-400"></i>
                </div>
                <h3 class="text-lg font-semibold text-white mb-1">Upload Foto Wedding/Event</h3>
                <p class="text-slate-400 text-sm">AI akan otomatis scan & beri alasan penilaian.<br>Bisa pilih banyak foto sekaligus dari galeri.</p>
            </div>
        </div>

        <!-- Grid -->
        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 pb-20"></div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadArea = document.getElementById('uploadArea');
        const grid = document.getElementById('grid');
        const statsBar = document.getElementById('statsBar');
        const btnExport = document.getElementById('btnExport');
        
        let images = [];
        let isProcessing = false;

        // Trigger File Input
        uploadArea.addEventListener('click', () => fileInput.click());
        
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if(!files.length || isProcessing) return;

            // Reset UI
            grid.innerHTML = ''; 
            images = [];
            statsBar.classList.remove('hidden');
            btnExport.classList.add('hidden');
            isProcessing = true;
            
            // Show Loading State on Upload Area
            uploadArea.innerHTML = `<div class="py-8"><i class="ph ph-spinner animate-spin text-3xl text-blue-400 mb-2"></i><p class="text-sm text-slate-400">Memuat ${files.length} foto...</p></div>`;

            // Load Images
            let loaded = 0;
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const obj = { 
                        id: Math.random().toString(36).substr(2,9), 
                        src: ev.target.result, 
                        name: file.name, 
                        category: 'pending', // good, moderate, bad
                        reason: '',
                        manualOverride: false 
                    };
                    images.push(obj);
                    renderCard(obj);
                    loaded++;
                    if(loaded === files.length) startAutoScan();
                };
                reader.readAsDataURL(file);
            });
        });

        function renderCard(img) {
            const div = document.createElement('div');
            div.className = 'photo-card aspect-[3/4] scanning';
            div.id = `card-${img.id}`;
            div.onclick = () => toggleSelection(img.id);
            
            div.innerHTML = `
                <img src="${img.src}" loading="lazy">
                <div class="scanner-line"></div>
                <div class="check-overlay"><i class="ph ph-check text-sm opacity-0"></i></div>
                <div class="status-badge bg-slate-900/80 text-slate-400"><i class="ph ph-hourglass"></i></div>
                <div class="reason-tag text-slate-300">Scanning...</div>
            `;
            grid.appendChild(div);
        }

        async function startAutoScan() {
            uploadArea.classList.add('hidden'); // Hide upload area after start
            
            for(let img of images) {
                await analyzeImage(img);
                updateCardUI(img);
                updateStats();
                // Small delay for visual effect
                await new Promise(r => setTimeout(r, 30)); 
            }
            
            isProcessing = false;
            btnExport.classList.remove('hidden');
            uploadArea.innerHTML = `<div class="py-4"><i class="ph ph-check-circle text-3xl text-emerald-400 mb-2"></i><p class="text-sm text-slate-400">Scan Selesai. Klik foto untuk ubah status manual.</p></div>`;
            uploadArea.classList.remove('hidden');
            uploadArea.onclick = () => fileInput.click(); // Re-enable click
        }

        // SIMULASI AI ANALYSIS (Mirip Aftershoots Logic)
        function analyzeImage(img) {
            return new Promise((resolve) => {
                const tempImg = new Image();
                tempImg.src = img.src;
                tempImg.onload = () => {
                    // 1. Cek Resolusi
                    const mp = (tempImg.width * tempImg.height) / 1000000;
                    
                    // 2. Simulasi Deteksi "Kesalahan" (Random Seed based on filename for consistency)
                    const seed = img.name.split('').reduce((a,b)=>a+b.charCodeAt(0),0);
                    const rand = (Math.sin(seed * 999) + 1) / 2; 

                    let category = 'good';
                    let reason = 'Komposisi & Fokus Bagus';

                    // Logika Kategorisasi
                    if (mp < 2) {
                        category = 'bad';
                        reason = 'Resolusi Terlalu Rendah';
                    } else if (rand > 0.85) {
                        category = 'bad';
                        reason = 'Terdeteksi Blur / Goyang';
                    } else if (rand > 0.70) {
                        category = 'moderate';
                        reason = 'Pencahayaan Kurang Ideal';
                    } else if (rand < 0.15) {
                        category = 'moderate';
                        reason = 'Ekspresi Wajah Netral';
                    }

                    img.category = category;
                    img.reason = reason;
                    resolve();
                };
            });
        }

        function updateCardUI(img) {
            const card = document.getElementById(`card-${img.id}`);
            if(!card) return;

            card.classList.remove('scanning', 'cat-good', 'cat-moderate', 'cat-bad');
            
            const badge = card.querySelector('.status-badge');
            const reasonTag = card.querySelector('.reason-tag');
            const checkIcon = card.querySelector('.check-overlay i');

            // Apply Category Styles
            if(img.category === 'good') {
                card.classList.add('cat-good');
                badge.className = 'status-badge bg-emerald-500 text-white';
                badge.innerHTML = '<i class="ph ph-check-fat"></i>';
                reasonTag.className = 'reason-tag bg-emerald-900/90 text-emerald-200 border border-emerald-500/30';
            } else if(img.category === 'moderate') {
                card.classList.add('cat-moderate');
                badge.className = 'status-badge bg-amber-500 text-white';
                badge.innerHTML = '<i class="ph ph-minus"></i>';
                reasonTag.className = 'reason-tag bg-amber-900/90 text-amber-200 border border-amber-500/30';
            } else {
                card.classList.add('cat-bad');
                badge.className = 'status-badge bg-red-500 text-white';
                badge.innerHTML = '<i class="ph ph-x"></i>';
                reasonTag.className = 'reason-tag bg-red-900/90 text-red-200 border border-red-500/30';
            }

            reasonTag.textContent = img.reason;

            // Handle Manual Override Visuals
            const overlay = card.querySelector('.check-overlay');
            if(img.manualOverride) {
                card.classList.add('manual-select');
                checkIcon.style.opacity = '1';
                // Jika di-override, kita anggap dia "Good" untuk export
                if(img.category !== 'good') reasonTag.textContent += ' (Manual Pick)';
            } else {
                card.classList.remove('manual-select');
                checkIcon.style.opacity = '0';
            }
        }

        // Toggle Manual Selection (Override AI)
        function toggleSelection(id) {
            if(isProcessing) return;
            const img = images.find(i => i.id === id);
            if(img) {
                img.manualOverride = !img.manualOverride;
                updateCardUI(img);
                updateStats();
            }
        }

        function updateStats() {
            // Hitung yang akan di-export (Good ATAU yang di-manual-override)
            const good = images.filter(i => i.category === 'good' && !i.manualOverride).length;
            const mod = images.filter(i => i.category === 'moderate' && !i.manualOverride).length;
            const bad = images.filter(i => i.category === 'bad' && !i.manualOverride).length;
            const overridden = images.filter(i => i.manualOverride).length;

            document.getElementById('countGood').innerText = good + overridden; // Override dianggap Good
            document.getElementById('countMod').innerText = mod;
            document.getElementById('countBad').innerText = bad;
        }

        // Export Logic
        btnExport.addEventListener('click', async () => {
            // Export: Category GOOD + Manual Overrides
            const toExport = images.filter(i => i.category === 'good' || i.manualOverride);
            
            if(!toExport.length) return alert('Tidak ada foto yang layak diexport!');

            const originalText = btnExport.innerHTML;
            btnExport.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Packing...';
            btnExport.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("procull-selected");

            for(let img of toExport) {
                try {
                    const res = await fetch(img.src);
                    const blob = await res.blob();
                    folder.file(img.name, blob);
                } catch(e) { console.error(e); }
            }

            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `procull-result-${Date.now()}.zip`);

            btnExport.innerHTML = originalText;
            btnExport.disabled = false;
        });

    </script>
</body>
</html>
