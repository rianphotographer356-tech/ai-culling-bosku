<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCull AI - Culling Foto Otomatis</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
        .photo-card { transition: all 0.4s ease; }
        .photo-card.rejected { opacity: 0.2; filter: grayscale(100%); transform: scale(0.95); }
        .photo-card.selected { border: 2px solid #10B981; box-shadow: 0 0 15px rgba(16,185,129,0.3); transform: scale(1.02); z-index: 10; }
        .scanner-line { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #10B981; box-shadow: 0 0 10px #10B981; animation: scan 1s infinite linear; display: none; }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .scanning .scanner-line { display: block; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <nav class="p-4 border-b border-white/10 bg-[#0B0F19]/90 backdrop-blur sticky top-0 z-50 flex justify-between items-center">
        <div class="font-bold text-xl text-emerald-400"><i class="ph ph-aperture"></i> ProCull AI</div>
        <div class="text-xs text-slate-400 bg-white/5 px-3 py-1 rounded-full">No Login • Local Process</div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 max-w-5xl">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold mb-2">AI Photo Culling <span class="text-emerald-400">Gratis</span></h1>
            <p class="text-slate-400 text-sm">Upload foto > AI Pilih Terbaik > Download ZIP. Semua di HP kamu.</p>
        </div>

        <!-- Upload Area -->
        <div class="border-2 border-dashed border-slate-700 rounded-2xl p-8 text-center cursor-pointer hover:border-emerald-500 hover:bg-white/5 transition mb-6 relative" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <i class="ph ph-upload-simple text-4xl text-emerald-400 mb-2"></i>
            <p class="font-semibold">Ketuk untuk Pilih Foto</p>
            <p class="text-xs text-slate-500 mt-1">Bisa pilih banyak foto sekaligus dari galeri</p>
        </div>

        <!-- Controls -->
        <div id="controls" class="hidden flex flex-wrap gap-3 mb-6 justify-center">
            <select id="mode" class="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm outline-none">
                <option value="strict">Strict (Hanya Sempurna)</option>
                <option value="moderate" selected>Moderate (Seimbang)</option>
                <option value="loose">Loose (Simpan Banyak)</option>
            </select>
            <button id="btnStart" class="bg-emerald-500 text-black font-bold px-6 py-2 rounded-lg text-sm flex items-center gap-2">
                <i class="ph ph-magic-wand"></i> Mulai AI
            </button>
            <button id="btnDownload" class="hidden bg-blue-500 text-white font-bold px-6 py-2 rounded-lg text-sm flex items-center gap-2">
                <i class="ph ph-download-simple"></i> Download ZIP
            </button>
        </div>

        <!-- Stats -->
        <div id="stats" class="hidden flex justify-between text-xs text-slate-400 mb-4 px-2">
            <span>Total: <b id="countTotal" class="text-white">0</b></span>
            <span class="text-emerald-400">Terpilih: <b id="countSelected">0</b></span>
        </div>

        <!-- Grid -->
        <div id="grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3"></div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const grid = document.getElementById('grid');
        const controls = document.getElementById('controls');
        const stats = document.getElementById('stats');
        const btnStart = document.getElementById('btnStart');
        const btnDownload = document.getElementById('btnDownload');
        let images = [];

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files).filter(f => f.type.startsWith('image/'));
            if(!files.length) return;
            
            grid.innerHTML = ''; images = [];
            controls.classList.remove('hidden');
            stats.classList.remove('hidden');
            btnDownload.classList.add('hidden');
            document.getElementById('countTotal').innerText = files.length;

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const obj = { id: Math.random().toString(36), src: ev.target.result, name: file.name, status: 'pending' };
                    images.push(obj);
                    
                    const div = document.createElement('div');
                    div.className = 'photo-card relative aspect-[3/4] rounded-lg overflow-hidden bg-slate-800 border border-white/5';
                    div.id = `c-${obj.id}`;
                    div.innerHTML = `<img src="${obj.src}" class="w-full h-full object-cover"><div class="scanner-line"></div><div class="badge absolute top-1 right-1 w-6 h-6 rounded-full bg-black/50 flex items-center justify-center opacity-0 transition"><i class="ph ph-check text-emerald-400"></i></div>`;
                    grid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        });

        btnStart.addEventListener('click', async () => {
            if(!images.length) return;
            btnStart.disabled = true; btnStart.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Proses...';
            const mode = document.getElementById('mode').value;
            const threshold = mode === 'strict' ? 0.7 : mode === 'loose' ? 0.3 : 0.5;

            for(let img of images) {
                const card = document.getElementById(`c-${img.id}`);
                card.classList.add('scanning');
                
                // Simulasi AI Score
                await new Promise(r => setTimeout(r, 50)); 
                const score = Math.random(); 
                img.score = score;
                
                const badge = card.querySelector('.badge');
                badge.style.opacity = '1';
                
                if(score >= threshold) {
                    img.status = 'selected';
                    card.classList.add('selected');
                    badge.innerHTML = '<i class="ph ph-check text-emerald-400"></i>';
                    badge.className = 'badge absolute top-1 right-1 w-6 h-6 rounded-full bg-emerald-500/20 border border-emerald-500 flex items-center justify-center';
                } else {
                    img.status = 'rejected';
                    card.classList.add('rejected');
                    badge.innerHTML = '<i class="ph ph-x text-red-400"></i>';
                    badge.className = 'badge absolute top-1 right-1 w-6 h-6 rounded-full bg-red-500/20 border border-red-500 flex items-center justify-center';
                }
                card.classList.remove('scanning');
            }

            document.getElementById('countSelected').innerText = images.filter(i => i.status === 'selected').length;
            btnStart.innerHTML = 'Selesai'; btnStart.disabled = false;
            btnDownload.classList.remove('hidden');
        });

        btnDownload.addEventListener('click', async () => {
            const selected = images.filter(i => i.status === 'selected');
            if(!selected.length) return alert('Tidak ada foto terpilih!');
            
            btnDownload.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Packing...';
            const zip = new JSZip();
            for(let img of selected) {
                const res = await fetch(img.src);
                const blob = await res.blob();
                zip.file(img.name, blob);
            }
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `procull-result-${Date.now()}.zip`);
            btnDownload.innerHTML = '<i class="ph ph-check"></i> Downloaded!';
        });
    </script>
</body>
</html>
