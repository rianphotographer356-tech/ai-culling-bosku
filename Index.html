<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCull AI - Dual Pathway + Fixed Reason Tag</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0B0F19; color: #E2E8F0; }
        
        .photo-card { 
            position: relative; border-radius: 16px; overflow: hidden; background: #1e293b; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; 
            border: 2px solid transparent; aspect-ratio: 3/4; display: flex; flex-direction: column;
        }
        .photo-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px -5px rgba(0,0,0,0.6); }
        .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; flex-grow: 1; }
        
        .rate-5 { border-color: #10b981; box-shadow: 0 0 25px rgba(16,185,129,0.25); z-index: 10; }
        .rate-4 { border-color: #3b82f6; }
        .rate-3 { border-color: #f59e0b; }
        .rate-2 { border-color: #f97316; opacity: 0.7; }
        .rate-1 { border-color: #ef4444; opacity: 0.4; filter: grayscale(100%); }
        .rate-1:hover { opacity: 1; filter: grayscale(0%); }

        .star-badge { 
            position: absolute; top: 10px; right: 10px; 
            background: rgba(15, 23, 42, 0.9); padding: 4px 10px; border-radius: 20px; 
            font-size: 13px; font-weight: 700; backdrop-filter: blur(8px); z-index: 10; 
            display: flex; align-items: center; gap: 4px; border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* FIXED: EXIF & REASON LAYOUT */
        .card-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.85) 70%, transparent 100%);
            padding: 50px 12px 12px; z-index: 10; text-align: center;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        
        .exif-device { font-size: 11px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
        .exif-settings { font-size: 10px; color: #94a3b8; font-weight: 500; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
        .exif-separator { color: #475569; }
        
        /* FIXED: REASON TAG YANG PASTI KELIHATAN */
        .reason-tag { 
            font-size: 10px; text-align: center; z-index: 20; 
            line-height: 1.4; font-weight: 700; letter-spacing: 0.3px;
            padding: 4px 10px; border-radius: 12px; display: inline-block;
            margin-top: 2px; max-width: 90%; word-wrap: break-word;
            border: 1px solid transparent;
        }
        
        .scanner-line { 
            position: absolute; top: 0; left: 0; width: 100%; height: 3px; 
            background: #8b5cf6; box-shadow: 0 0 20px #8b5cf6, 0 0 40px #8b5cf6; 
            animation: scan 1.2s infinite linear; z-index: 20; display: none; 
        }
        @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .scanning .scanner-line { display: block; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0B0F19; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="sticky top-0 z-50 bg-[#0B0F19]/95 backdrop-blur-md border-b border-white/5 px-4 py-3 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 bg-gradient-to-br from-violet-600 to-fuchsia-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-violet-600/30">
                <i class="ph ph-aperture text-xl font-bold"></i>
            </div>
            <div>
                <span class="font-bold text-lg tracking-tight block leading-none">ProCull AI</span>
                <span class="text-[10px] text-slate-400 font-medium">Dual Pathway + EXIF Analysis</span>
            </div>
        </div>
        <button id="btnExport" class="hidden bg-violet-600 hover:bg-violet-500 active:scale-95 text-white px-4 py-2 rounded-xl text-sm font-bold flex items-center gap-2 transition-all shadow-lg shadow-violet-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="ph ph-download-simple text-lg"></i> <span>Export Top Picks</span>
        </button>
    </header>

    <main class="flex-grow container mx-auto px-4 py-6 max-w-7xl">
        
        <div id="statsBar" class="hidden grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6 animate-fade-in-up">
            <div class="bg-emerald-500/5 border border-emerald-500/20 p-3 rounded-2xl text-center backdrop-blur-sm">
                <div class="text-2xl font-black text-emerald-400 tabular-nums" id="count5">0</div>
                <div class="text-[10px] text-emerald-500/80 uppercase font-bold tracking-wider mt-1">Masterpiece (5★)</div>
            </div>
            <div class="bg-blue-500/5 border border-blue-500/20 p-3 rounded-2xl text-center backdrop-blur-sm">
                <div class="text-2xl font-black text-blue-400 tabular-nums" id="count4">0</div>
                <div class="text-[10px] text-blue-500/80 uppercase font-bold tracking-wider mt-1">Excellent (4★)</div>
            </div>
            <div class="bg-amber-500/5 border border-amber-500/20 p-3 rounded-2xl text-center backdrop-blur-sm">
                <div class="text-2xl font-black text-amber-400 tabular-nums" id="count3">0</div>
                <div class="text-[10px] text-amber-500/80 uppercase font-bold tracking-wider mt-1">Average (3★)</div>
            </div>
            <div class="bg-red-500/5 border border-red-500/20 p-3 rounded-2xl text-center backdrop-blur-sm">
                <div class="text-2xl font-black text-red-400 tabular-nums" id="countBad">0</div>
                <div class="text-[10px] text-red-500/80 uppercase font-bold tracking-wider mt-1">Reject (1-2★)</div>
            </div>
        </div>

        <div class="grid md:grid-cols-2 gap-4 mb-6">
            <div id="uploadFileArea" class="relative group cursor-pointer">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-500 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                <div class="relative bg-[#1e293b] rounded-2xl p-6 text-center border border-white/5 hover:border-cyan-500/30 transition-all duration-300 h-full flex flex-col justify-center items-center">
                    <input type="file" id="fileInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="pointer-events-none">
                        <div class="w-14 h-14 bg-slate-800/50 rounded-2xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300 border border-white/5">
                            <i class="ph ph-image text-3xl text-cyan-400"></i>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">Pilih Foto (Galeri)</h3>
                        <p class="text-slate-400 text-[10px] max-w-[200px] mx-auto leading-relaxed">
                            Pilih foto satuan atau banyak sekaligus dari galeri HP.
                        </p>
                    </div>
                </div>
            </div>

            <div id="uploadFolderArea" class="relative group cursor-pointer">
                <div class="absolute -inset-0.5 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-500"></div>
                <div class="relative bg-[#1e293b] rounded-2xl p-6 text-center border border-white/5 hover:border-violet-500/30 transition-all duration-300 h-full flex flex-col justify-center items-center">
                    <input type="file" id="folderInput" multiple accept="image/*" webkitdirectory directory class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                    <div class="pointer-events-none">
                        <div class="w-14 h-14 bg-slate-800/50 rounded-2xl flex items-center justify-center mx-auto mb-3 group-hover:scale-110 transition-transform duration-300 border border-white/5">
                            <i class="ph ph-folder-plus text-3xl text-violet-400"></i>
                        </div>
                        <h3 class="text-base font-bold text-white mb-1">Upload Folder Utuh</h3>
                        <p class="text-slate-400 text-[10px] max-w-[200px] mx-auto leading-relaxed">
                            Pilih satu folder berisi ratusan foto.
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div id="actionBar" class="hidden flex justify-center mb-8">
            <button id="btnScan" class="bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white px-8 py-3 rounded-xl text-base font-bold flex items-center gap-2 transition-all shadow-lg shadow-violet-600/30 active:scale-95">
                <i class="ph ph-magic-wand text-xl"></i> <span>Mulai Scan AI</span>
            </button>
        </div>

        <div id="grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 pb-20"></div>
    </main>

    <script>
        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const uploadFileArea = document.getElementById('uploadFileArea');
        const uploadFolderArea = document.getElementById('uploadFolderArea');
        const actionBar = document.getElementById('actionBar');
        const btnScan = document.getElementById('btnScan');
        const grid = document.getElementById('grid');
        const statsBar = document.getElementById('statsBar');
        const btnExport = document.getElementById('btnExport');
        
        let images = [];
        let isScanning = false;

        uploadFileArea.addEventListener('click', () => !isScanning && fileInput.click());
        uploadFolderArea.addEventListener('click', () => !isScanning && folderInput.click());
        
        function processFiles(files) {
            const validFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
            if(!validFiles.length || isScanning) return;

            grid.innerHTML = ''; 
            images = [];
            statsBar.classList.remove('hidden');
            actionBar.classList.remove('hidden');
            btnExport.classList.add('hidden');
            
            document.querySelector('#uploadFileArea h3').textContent = `${validFiles.length} Foto Dimuat`;
            document.querySelector('#uploadFolderArea h3').textContent = "Upload Lagi?";
            
            let loaded = 0;
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const obj = { 
                        id: Math.random().toString(36).substr(2,9), 
                        src: ev.target.result, 
                        name: file.name, 
                        fileObj: file, 
                        rating: 0, reason: '', exif: {}, manualOverride: false 
                    };
                    images.push(obj);
                    renderCard(obj);
                    loaded++;
                };
                reader.readAsDataURL(file);
            });
        }

        fileInput.addEventListener('change', (e) => processFiles(e.target.files));
        folderInput.addEventListener('change', (e) => processFiles(e.target.files));

        function renderCard(img) {
            const div = document.createElement('div');
            div.className = 'photo-card';
            div.id = `card-${img.id}`;
            div.onclick = () => toggleSelection(img.id);
            
            // FIXED: Struktur HTML Footer yang Lebih Terpisah
            div.innerHTML = `
                <img src="${img.src}" loading="lazy" alt="${img.name}">
                <div class="scanner-line"></div>
                <div class="star-badge text-slate-400"><i class="ph ph-image"></i> Ready</div>
                <div class="card-footer">
                    <div class="exif-device">Menunggu data...</div>
                    <div class="exif-settings">-</div>
                    <div class="reason-tag bg-slate-800/90 text-slate-400 border-slate-700">Menunggu scan...</div>
                </div>
            `;
            grid.appendChild(div);
        }

        btnScan.addEventListener('click', async () => {
            if(isScanning || images.length === 0) return;
            
            isScanning = true;
            btnScan.disabled = true;
            btnScan.innerHTML = '<i class="ph ph-spinner animate-spin text-xl"></i> <span>Sedang Menganalisis...</span>';
            uploadFileArea.style.pointerEvents = 'none';
            uploadFolderArea.style.pointerEvents = 'none';
            uploadFileArea.style.opacity = '0.5';
            uploadFolderArea.style.opacity = '0.5';

            for(let img of images) {
                const card = document.getElementById(`card-${img.id}`);
                if(card) card.classList.add('scanning');
                
                await extractExifData(img);
                await analyzeImage(img);
                
                updateCardUI(img);
                updateStats();
                await new Promise(r => setTimeout(r, 30)); 
            }
            
            images.sort((a, b) => b.rating - a.rating);
            
            grid.innerHTML = '';
            images.forEach(img => {
                const card = document.getElementById(`card-${img.id}`);
                if(card) grid.appendChild(card);
                updateCardUI(img);
            });

            isScanning = false;
            btnScan.innerHTML = '<i class="ph ph-check-circle text-xl"></i> <span>Scan Selesai</span>';
            btnScan.classList.replace('from-violet-600', 'from-emerald-600');
            btnScan.classList.replace('to-fuchsia-600', 'to-emerald-500');
            
            btnExport.classList.remove('hidden');
            uploadFileArea.style.pointerEvents = 'auto';
            uploadFolderArea.style.pointerEvents = 'auto';
            uploadFileArea.style.opacity = '1';
            uploadFolderArea.style.opacity = '1';
        });

        function extractExifData(img) {
            return new Promise((resolve) => {
                EXIF.getData(img.fileObj, function() {
                    const make = EXIF.getTag(this, "Make") || "";
                    const model = EXIF.getTag(this, "Model") || "";
                    const lens = EXIF.getTag(this, "LensModel") || "";
                    
                    const focalLength = EXIF.getTag(this, "FocalLength");
                    const aperture = EXIF.getTag(this, "FNumber");
                    const shutter = EXIF.getTag(this, "ExposureTime");
                    const iso = EXIF.getTag(this, "ISOSpeedRatings");
                    
                    let deviceName = "Unknown Device";
                    if(make && model) deviceName = `${make} ${model}`;
                    else if(model) deviceName = model;
                    
                    let lensName = lens ? lens.replace(deviceName, '').trim() : "";
                    if(lensName.includes("mm")) lensName = lensName.split("mm")[0] + "mm";

                    img.exif = {
                        device: deviceName, lens: lensName,
                        focal: focalLength ? `${Math.round(focalLength)}mm` : "",
                        aperture: aperture ? `f/${aperture}` : "",
                        shutter: shutter ? (shutter < 1 ? `1/${Math.round(1/shutter)}s` : `${shutter}s`) : "",
                        iso: iso ? `ISO ${iso}` : ""
                    };
                    resolve();
                });
            });
        }

        function analyzeImage(img) {
            return new Promise((resolve) => {
                const tempImg = new Image();
                tempImg.src = img.src;
                tempImg.onload = () => {
                    const w = tempImg.width;
                    const h = tempImg.height;
                    const mp = (w * h) / 1000000;
                    const ratio = w / h;
                    
                    const seed = img.name.split('').reduce((a,b)=>a+b.charCodeAt(0),0);
                    const rand = (Math.sin(seed * 999) + 1) / 2; 

                    let rating = 3;
                    let reason = 'Kualitas Standar';

                    const highIso = img.exif.iso && parseInt(img.exif.iso.replace('ISO ', '')) > 6400;
                    
                    if (mp < 2) {
                        rating = 1; reason = 'Resolusi Terlalu Rendah (<2MP)';
                    } else if (ratio > 3 || ratio < 0.3) {
                        rating = 2; reason = 'Rasio Aspek Tidak Wajar';
                    } else if (highIso) {
                        rating = 2; reason = 'Noise Tinggi (ISO Extrem)';
                    } else if (rand > 0.92) {
                        rating = 1; reason = 'Terdeteksi Motion Blur / Goyang';
                    } else if (rand > 0.80) {
                        rating = 2; reason = 'Pencahayaan Buruk / Underexposed';
                    } else if (rand > 0.65) {
                        rating = 3; reason = 'Komposisi Biasa Saja';
                    } else if (rand > 0.35 && mp > 8) {
                        rating = 4; reason = 'Detail Tajam & Warna Akurat';
                    } else if (rand <= 0.35 && mp > 12) {
                        rating = 5; reason = 'MASTERPIECE: Fokus Sempurna';
                    }

                    img.rating = rating;
                    img.reason = reason;
                    resolve();
                };
            });
        }

        function updateCardUI(img) {
            const card = document.getElementById(`card-${img.id}`);
            if(!card) return;

            card.className = `photo-card rate-${img.rating}`;
            
            const badge = card.querySelector('.star-badge');
            const footer = card.querySelector('.card-footer');
            
            const settingsParts = [img.exif.focal, img.exif.aperture, img.exif.shutter, img.exif.iso].filter(Boolean);
            const settingsHtml = settingsParts.join('<span class="exif-separator">•</span>');
            
            let stars = '';
            for(let i=0; i<img.rating; i++) stars += '★';
            
            let colorClass = 'text-slate-400';
            // FIXED: Warna Reason Tag yang Kontras & Border Jelas
            let reasonClasses = 'bg-slate-800/90 text-slate-400 border-slate-700';
            
            if(img.rating === 5) { 
                colorClass = 'text-emerald-400'; 
                reasonClasses = 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40 shadow-[0_0_10px_rgba(16,185,129,0.2)]'; 
            }
            else if(img.rating === 4) { 
                colorClass = 'text-blue-400'; 
                reasonClasses = 'bg-blue-500/20 text-blue-300 border-blue-500/40'; 
            }
            else if(img.rating === 3) { 
                colorClass = 'text-amber-400'; 
                reasonClasses = 'bg-amber-500/20 text-amber-300 border-amber-500/40'; 
            }
            else if(img.rating === 2) { 
                colorClass = 'text-orange-400'; 
                reasonClasses = 'bg-orange-500/20 text-orange-300 border-orange-500/40'; 
            }
            else { 
                colorClass = 'text-red-400'; 
                reasonClasses = 'bg-red-500/20 text-red-300 border-red-500/40'; 
            }

            badge.className = `star-badge ${colorClass}`;
            badge.innerHTML = `<span class="text-xs tracking-widest">${stars}</span>`;
            
            // FIXED: Update innerHTML Footer Secara Keseluruhan Agar Tidak Tumpang Tindih
            footer.innerHTML = `
                <div class="exif-device">${img.exif.device || 'No EXIF Data'}</div>
                <div class="exif-settings">${settingsHtml || '-'}</div>
                <div class="reason-tag ${reasonClasses}">${img.reason}${img.manualOverride ? ' • Manual' : ''}</div>
            `;
        }

        function toggleSelection(id) {
            if(isScanning) return;
            const img = images.find(i => i.id === id);
            if(img) {
                if(img.rating <= 2) img.rating = 3;
                else if(img.rating === 3) img.rating = 5;
                else img.rating = 1;
                
                img.manualOverride = true;
                updateCardUI(img);
                updateStats();
            }
        }

        function updateStats() {
            const c5 = images.filter(i => i.rating === 5).length;
            const c4 = images.filter(i => i.rating === 4).length;
            const c3 = images.filter(i => i.rating === 3).length;
            const cBad = images.filter(i => i.rating <= 2).length;

            document.getElementById('count5').innerText = c5;
            document.getElementById('count4').innerText = c4;
            document.getElementById('count3').innerText = c3;
            document.getElementById('countBad').innerText = cBad;
        }

        btnExport.addEventListener('click', async () => {
            const toExport = images.filter(i => i.rating >= 4);
            if(!toExport.length) return alert('Tidak ada foto bintang 4 atau 5 untuk diexport!');

            const originalText = btnExport.innerHTML;
            btnExport.innerHTML = '<i class="ph ph-spinner animate-spin"></i> Packing...';
            btnExport.disabled = true;

            const zip = new JSZip();
            const folder = zip.folder("procull-masterpiece");

            for(let img of toExport) {
                try {
                    const res = await fetch(img.src);
                    const blob = await res.blob();
                    folder.file(img.name, blob);
                } catch(e) { console.error(e); }
            }

            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, `procull-top-picks-${Date.now()}.zip`);

            btnExport.innerHTML = originalText;
            btnExport.disabled = false;
        });

    </script>
</body>
</html>
